name: Actualizar catalogo

# Cada 2 horas revisa las releases de GitHub de todos los módulos. Se aplican
# automáticamente las versiones cuya estructura de paquete no cambia; el
# firmware nunca se actualiza solo: se abre un PR (rama auto/firmware) para
# aprobarlo con «Merge», incluso desde el móvil.
# Los demás cambios se publican directamente en main.
# Discord:
#   DISCORD_WEBHOOK_PUBLICO  → #cfw-updates: solo las actualizaciones aplicadas.
#   DISCORD_WEBHOOK_CATALOGO → #nx-swite-catalogo: estado y advertencias en
#                              cada ejecución (cada 2 horas).
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      reanunciar:
        description: "Reenviar a Discord el último informe aunque no haya cambios"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Generar catalogo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet run --project tools/NX-Suite.Catalogo -c Release
      - name: Validar JSON
        run: python3 -c "import json; d=json.load(open('catalogo/catalogo.json', encoding='utf-8')); assert len(d['Modulos']) > 0"
      - name: Publicar en main
        id: publicar
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- catalogo/catalogo.json; then
            git checkout -q -- catalogo/ultimo-informe.md 2>/dev/null || true
            echo "cambios=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git add catalogo/catalogo.json catalogo/ultimo-informe.md
          git commit -qm "catalogo: actualizar paquetes desde GitHub Releases"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          echo "cambios=true" >> "$GITHUB_OUTPUT"
      - name: Anunciar actualizaciones en Discord
        if: steps.publicar.outputs.cambios == 'true' || inputs.reanunciar
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_PUBLICO }}
        run: python3 scripts/anunciar-discord.py catalogo/ultimo-informe.md actualizaciones
      - name: Estado y advertencias en Discord (canal privado)
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_CATALOGO }}
        run: python3 scripts/anunciar-discord.py catalogo/ultimo-informe.md estado
      - name: Preparar firmware nuevo
        id: firmware
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet run --project tools/NX-Suite.Catalogo -c Release --no-build -- \
            --solo firmware --aprobacion-manual "" --informe "$RUNNER_TEMP/firmware.md"
          if git diff --quiet -- catalogo/catalogo.json; then echo "nuevo=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "nuevo=true" >> "$GITHUB_OUTPUT"
          version=$(jq -r '.Modulos[] | select(.Id=="firmware") | .Versiones[0].Version' catalogo/catalogo.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Al fusionar el PR, la app muestra también esta versión como «Versión compatible».
          sed -i -E "0,/\"VersionCompatible\": \"[^\"]*\"/s//\"VersionCompatible\": \"$version\"/" catalogo/catalogo.json
          { echo "⚠️ Revisa que Atmosphère y hekate soporten esta versión antes de fusionar."; echo; cat "$RUNNER_TEMP/firmware.md"; } > "$RUNNER_TEMP/cuerpo.md"
      - name: Abrir PR de firmware
        if: steps.firmware.outputs.nuevo == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/firmware
          commit-message: "catalogo: firmware ${{ steps.firmware.outputs.version }}"
          title: "Firmware ${{ steps.firmware.outputs.version }} (requiere aprobación)"
          body-path: ${{ runner.temp }}/cuerpo.md
          add-paths: catalogo/catalogo.json
