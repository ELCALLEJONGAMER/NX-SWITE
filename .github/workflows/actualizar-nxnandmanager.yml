name: Actualizar NxNandManager

# Busca la última build correcta de eliboa/NxNandManager (workflow «build»,
# push a master), la reempaqueta (NxNandManager.exe + dokan1.dll), la sube al
# repo NX-SWITE.ASSETS (sin crear releases) y actualiza la URL y el SHA256 del
# catálogo directamente en main. Requiere el secret ASSETS_TOKEN (PAT con
# permiso Contents: write sobre NX-SWITE.ASSETS).

on:
  schedule:
    - cron: "30 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ORIGEN: eliboa/NxNandManager
      ASSETS: ELCALLEJONGAMER/NX-SWITE.ASSETS
      RUTA: assets/tools/NxNandManager
    steps:
      - uses: actions/checkout@v4

      - name: Buscar última build válida
        id: build
        run: |
          actual=$(jq -r '.tools.CLI_NX_NAND_MANAGER_VERSION' catalogo/catalogo.json)
          prefijo="${actual%-*}"
          sha_actual="${actual##*-}"

          run=$(gh api "repos/$ORIGEN/actions/workflows/build.yml/runs?branch=master&event=push&status=success&per_page=1" \
                --jq '.workflow_runs[0] | "\(.id) \(.head_sha)"')
          read run_id head_sha <<< "$run"
          corto="${head_sha:0:7}"
          echo "Publicado: $actual  ·  Última build: $corto (run $run_id)"

          if [ "$corto" = "$sha_actual" ]; then echo "nuevo=false" >> "$GITHUB_OUTPUT"; exit 0; fi

          # Ignorar commits que solo tocan documentación (README, .md…).
          cambios=$(gh api "repos/$ORIGEN/compare/$sha_actual...$head_sha" \
                    --jq '[.files[].filename | select(test("\\.(md|txt|png|jpg)$"; "i") | not)] | length')
          if [ "$cambios" = "0" ]; then echo "Solo cambia documentación"; echo "nuevo=false" >> "$GITHUB_OUTPUT"; exit 0; fi

          echo "nuevo=true" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "corto=$corto" >> "$GITHUB_OUTPUT"
          echo "version=$prefijo-$corto" >> "$GITHUB_OUTPUT"
          echo "zip=NxNandManager_${prefijo}_${corto}.zip" >> "$GITHUB_OUTPUT"

      - name: Descargar y reempaquetar
        if: steps.build.outputs.nuevo == 'true'
        id: zip
        run: |
          mkdir -p art paquete
          gh run download "${{ steps.build.outputs.run_id }}" -R "$ORIGEN" -n NxNandManager -D art
          exe=$(find art -iname 'NxNandManager.exe' | head -n1)
          dll=$(find art -iname 'dokan1.dll' | head -n1)
          [ -n "$exe" ] || { echo "::error::El artefacto no trae NxNandManager.exe"; exit 1; }
          cp "$exe" paquete/
          [ -n "$dll" ] && cp "$dll" paquete/
          (cd paquete && zip -9 "../${{ steps.build.outputs.zip }}" *)
          echo "sha=$(sha256sum "${{ steps.build.outputs.zip }}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # El ZIP se sube a NX-SWITE.ASSETS (no a Releases, para no mezclarlo con
      # las versiones de NX-SWITE). Los ZIP anteriores se conservan para que las
      # descargas no fallen mientras el PR está pendiente.
      - name: Publicar ZIP en NX-SWITE.ASSETS
        if: steps.build.outputs.nuevo == 'true'
        id: rel
        env:
          ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: |
          [ -n "$ASSETS_TOKEN" ] || { echo "::error::Falta el secret ASSETS_TOKEN"; exit 1; }
          zip="${{ steps.build.outputs.zip }}"
          git clone -q --depth 1 "https://x-access-token:$ASSETS_TOKEN@github.com/$ASSETS.git" assets-repo
          rama=$(git -C assets-repo rev-parse --abbrev-ref HEAD)
          mkdir -p "assets-repo/$RUTA"
          cp "$zip" "assets-repo/$RUTA/"
          git -C assets-repo config user.name  "github-actions[bot]"
          git -C assets-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C assets-repo add "$RUTA/$zip"
          git -C assets-repo diff --cached --quiet || git -C assets-repo commit -qm "NxNandManager ${{ steps.build.outputs.version }}"
          git -C assets-repo push -q origin "$rama"
          echo "url=https://github.com/$ASSETS/raw/refs/heads/$rama/$RUTA/$zip" >> "$GITHUB_OUTPUT"

      - name: Actualizar catálogo
        if: steps.build.outputs.nuevo == 'true'
        run: |
          jq --arg url "${{ steps.rel.outputs.url }}" --arg sha "sha256:${{ steps.zip.outputs.sha }}" \
             --arg zip "${{ steps.build.outputs.zip }}" --arg ver "${{ steps.build.outputs.version }}" \
             '.tools.CLI_NX_NAND_MANAGER=$url | .tools.CLI_NX_NAND_MANAGER_SHA256=$sha
              | .tools.CLI_NX_NAND_MANAGER_FILENAME=$zip | .tools.CLI_NX_NAND_MANAGER_VERSION=$ver' \
             catalogo/catalogo.json > tmp.json
          mv tmp.json catalogo/catalogo.json

      # Commit directo a main: NX-SWITE lee el catálogo remoto y verá la nueva
      # versión sin intervención manual.
      - name: Publicar catálogo
        if: steps.build.outputs.nuevo == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo/catalogo.json
          git diff --cached --quiet && exit 0
          git commit -qm "catalogo: NxNandManager ${{ steps.build.outputs.version }}"
          git pull -q --rebase origin main
          git push -q origin HEAD:main

      - name: Anunciar en Discord
        if: steps.build.outputs.nuevo == 'true'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_PUBLICO }}
        run: |
          [ -n "$WEBHOOK" ] || exit 0
          texto="📦 **Nuevas actualizaciones disponibles en NX-SWITE**\n• **NxNandManager**: ${{ steps.build.outputs.version }}"
          curl -fsS -H "Content-Type: application/json" -d "{\"content\":\"$texto\"}" "$WEBHOOK"
